  <path d="M 395 793 L 445 793 L 445 1045 L 1245 1045 L 1245 738 L 1285 738" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="780" y="1037" width="90" height="14"/>
  <text x="825" y="1045" class="edge-label">image bytes</text>

