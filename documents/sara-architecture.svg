  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1620"/>

  <text x="850" y="36" font-size="24" font-weight="700" fill="#0f172a">SARa - System Architecture</text>
  <text x="850" y="62" font-size="13" fill="#64748b">React/Vite SPA - Django REST API - Supabase Auth/Postgres/Storage - OpenAI - MedGemma - Langfuse</text>

  <!-- Admin / content ops -->
  <rect class="group" x="40" y="95" width="340" height="205"/>
  <text x="60" y="120" class="group-title" text-anchor="start">Admin / Medical Advisor</text>

  <rect class="node-admin" x="80" y="150" width="260" height="74"/>
  <text x="210" y="172" class="label">Curated Case Data</text>
  <text x="210" y="192" class="sub">cases - case_images - answer_keys</text>
  <text x="210" y="209" class="sub">step_rubrics - disease_profiles</text>

  <text x="210" y="252" class="sub">Roles: admin / medical_advisor</text>
  <text x="210" y="270" class="sub">Seed and maintain system cases</text>

  <!-- Client -->
  <rect class="group" x="1080" y="95" width="580" height="205"/>
  <text x="1100" y="120" class="group-title" text-anchor="start">Client - Browser</text>

  <rect class="node-fe" x="1410" y="140" width="220" height="56"/>
  <text x="1520" y="160" class="label">React SPA</text>
  <text x="1520" y="180" class="sub">Vite - TypeScript - Tailwind - Radix/MUI</text>

  <rect class="node-fe" x="1100" y="225" width="170" height="56"/>
  <text x="1185" y="245" class="label">Upload Cases</text>
  <text x="1185" y="265" class="sub">/upload</text>

  <rect class="node-fe" x="1290" y="225" width="190" height="56"/>
  <text x="1385" y="245" class="label">Browse / Practice</text>
  <text x="1385" y="265" class="sub">/practice - /session/:caseId</text>

  <rect class="node-fe" x="1500" y="225" width="160" height="56"/>
  <text x="1580" y="245" class="label">Exam / Swap</text>
  <text x="1580" y="265" class="sub">/exam - /swap</text>

  <path d="M 1520 196 L 1520 210 L 1185 210 L 1185 225" class="edge" marker-end="url(#arr)"/>
  <path d="M 1385 210 L 1385 225" class="edge" marker-end="url(#arr)"/>
  <path d="M 1520 210 L 1580 210 L 1580 225" class="edge" marker-end="url(#arr)"/>

  <!-- Backend -->
  <rect class="group" x="40" y="340" width="1620" height="860"/>
  <text x="60" y="364" class="group-title" text-anchor="start">Backend - Django REST Framework API</text>

  <rect class="node-be" x="720" y="395" width="220" height="55"/>
  <text x="830" y="414" class="label">Auth + Request Context</text>
  <text x="830" y="432" class="sub">Supabase JWT auth + RLS token binding</text>

  <rect class="node-be" x="720" y="470" width="220" height="55"/>
  <text x="830" y="489" class="label">DRF API Router</text>
  <text x="830" y="507" class="sub">auth - cases - sessions - upload - swap - exam</text>

  <path d="M 830 450 L 830 470" class="edge" marker-end="url(#arr)"/>

  <!-- Upload pipeline -->
  <rect class="subgroup" x="65" y="560" width="370" height="455"/>
  <text x="85" y="583" class="group-title" text-anchor="start">Upload + Case Generation</text>

  <rect class="node-be" x="105" y="610" width="290" height="42"/>
  <text x="250" y="631" class="label-sm">UserUploadedCaseViewSet</text>

  <rect class="node-be" x="105" y="664" width="290" height="42"/>
  <text x="250" y="680" class="label-sm">Image Count + Metadata Validation</text>
  <text x="250" y="697" class="sub">modality - region - volume names</text>

  <rect class="node-ai" x="105" y="718" width="290" height="42"/>
  <text x="250" y="734" class="label-sm">GPT-4o Image Validation</text>
  <text x="250" y="751" class="sub">medical / modality / region checks</text>

  <rect class="node-db" x="105" y="772" width="290" height="42"/>
  <text x="250" y="788" class="label-sm">Upload Images to Supabase Storage</text>
  <text x="250" y="805" class="sub">bucket: images - public URLs</text>

  <rect class="node-ai" x="105" y="826" width="290" height="42"/>
  <text x="250" y="842" class="label-sm">Analyze Medical Image</text>
  <text x="250" y="859" class="sub">engine: vlm or gpt</text>

  <rect class="node-db" x="105" y="880" width="290" height="42"/>
  <text x="250" y="896" class="label-sm">Create Uploaded Case</text>
  <text x="250" y="913" class="sub">cases - case_images - answer_keys</text>

