  <!-- 3 child boxes → API Gateway -->
  <path d="M 1185 281 L 1185 360 L 780 360 L 780 395" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="1146" y="353" width="78" height="14"/>
  <text x="1185" y="361" class="edge-label">multipart</text>

  <path d="M 1385 281 L 1385 375 L 830 375 L 830 395" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="1345" y="368" width="90" height="14"/>
  <text x="1390" y="376" class="edge-label">GET /cases</text>

  <path d="M 1580 281 L 1580 360 L 880 360 L 880 395" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="1480" y="353" width="170" height="14"/>
  <text x="1565" y="361" class="edge-label">POST submit_answer · SSE</text>

  <!-- Admin Upload → API Gateway -->
  <path d="M 340 185 L 600 185 L 600 380 L 720 380 L 720 408 L 720 408" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="430" y="178" width="130" height="14"/>
  <text x="495" y="186" class="edge-label">Ingest case (admin)</text>

  <!-- ============ BACKEND → CLIENT (response, dashed) ============ -->
  <path d="M 940 420 L 985 420 L 985 130 L 1520 130 L 1520 140" class="edge-dim" marker-end="url(#arrDim)"/>
  <rect class="edge-bg" x="1100" y="123" width="200" height="14"/>
  <text x="1200" y="131" class="edge-label">feedback · score · stream</text>

  <!-- ============ DATA LAYER ============ -->
  <rect class="group" x="40" y="1230" width="1620" height="290"/>
  <text x="60" y="1254" class="group-title" text-anchor="start">🗄 Data Layer — Supabase (PostgreSQL · Auth · Storage)</text>

  <!-- Supabase Auth -->
  <rect class="node-db" x="80" y="1285" width="280" height="90"/>
  <text x="220" y="1310" class="label-sm">Supabase Auth (JWT)</text>
  <text x="220" y="1330" class="sub">sign in · sign up · verify</text>
  <text x="220" y="1347" class="sub">RLS: user_id = auth.uid()</text>

  <!-- Object Storage cylinder -->
  <g transform="translate(420,1285)">
    <ellipse cx="160" cy="6" rx="158" ry="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
    <path d="M 2 6 L 2 100 A 158 6 0 0 0 318 100 L 318 6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
    <ellipse cx="160" cy="6" rx="158" ry="6" fill="none" stroke="#a855f7" stroke-width="1.4"/>
    <text x="160" y="36" class="label-sm">Object Storage</text>
    <text x="160" y="58" class="sub">Bucket: images</text>
    <text x="160" y="78" class="sub">Signed URLs · 7-day TTL</text>
  </g>

  <!-- PostgreSQL cylinder -->
  <g transform="translate(820,1275)">
    <ellipse cx="400" cy="6" rx="398" ry="7" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
    <path d="M 2 6 L 2 220 A 398 7 0 0 0 798 220 L 798 6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
    <ellipse cx="400" cy="6" rx="398" ry="7" fill="none" stroke="#a855f7" stroke-width="1.4"/>
    <text x="400" y="36" class="label-sm" font-weight="600">PostgreSQL — Row Level Security</text>

    <text x="160" y="76" class="sub" font-weight="600">Core</text>
    <text x="160" y="94" class="sub">users · cases · case_images</text>
    <text x="160" y="110" class="sub">disease_profiles</text>

    <text x="400" y="76" class="sub" font-weight="600">Sessions</text>
    <text x="400" y="94" class="sub">sessions · step_attempts</text>
    <text x="400" y="110" class="sub">step_rubrics · answer_keys</text>

    <text x="640" y="76" class="sub" font-weight="600">Modes</text>
    <text x="640" y="94" class="sub">swap_sessions · swap_messages</text>
    <text x="640" y="110" class="sub">exam_sessions</text>

    <text x="400" y="150" class="sub" font-weight="600">Analytics</text>
    <text x="400" y="168" class="sub">user_skill_profiles · case_recommendations</text>

    <text x="400" y="200" class="sub" font-style="italic">All tables RLS-enforced via JWT-bound context</text>
  </g>

  <!-- ============ BACKEND → DATA LAYER (clean orthogonal channels) ============ -->

  <!-- API Gateway → Supabase Auth (via far-left margin x=55, dashed) -->
  <path d="M 720 420 L 55 420 L 55 1320 L 80 1320" class="edge-dim" marker-end="url(#arrDim)"/>
  <rect class="edge-bg" x="14" y="860" width="84" height="14"/>
  <text x="56" y="868" class="edge-label">JWT verify</text>

  <!-- Image Storage Upload → Object Storage (channel y=1100, col1 inner margin x=415) -->
  <path d="M 395 739 L 415 739 L 415 1100 L 580 1100 L 580 1285" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="430" y="1092" width="100" height="14"/>
  <text x="480" y="1100" class="edge-label">PUT image blob</text>

  <!-- INSERT cases → PostgreSQL (channel y=1130) -->
  <path d="M 250 922 L 250 1130 L 1000 1130 L 1000 1281" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="620" y="1122" width="170" height="14"/>
  <text x="705" y="1130" class="edge-label">INSERT cases · case_images</text>

  <!-- Session State Manager → PostgreSQL (channel y=1160, col2-col3 gap x=850) -->
  <path d="M 815 630 L 850 630 L 850 1160 L 1220 1160 L 1220 1281" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="990" y="1152" width="170" height="14"/>
  <text x="1075" y="1160" class="edge-label">UPDATE sessions · attempts</text>

  <!-- Answer Check → PostgreSQL (channel y=1190, col3-col4 gap x=1245) -->
  <path d="M 1215 750 L 1245 750 L 1245 1190 L 1450 1190 L 1450 1281" class="edge" marker-end="url(#arr)"/>
  <rect class="edge-bg" x="1280" y="1182" width="160" height="14"/>
  <text x="1360" y="1190" class="edge-label">INSERT step_attempts</text>

  <!-- ============ LEGEND ============ -->
  <rect class="group" x="40" y="1540" width="1620" height="60"/>
  <text x="60" y="1562" class="group-title" text-anchor="start">Legend</text>

  <rect class="node-fe" x="60" y="1576" width="24" height="16"/>
  <text x="92" y="1584" class="sub" text-anchor="start">Frontend (React)</text>

  <rect class="node-be" x="230" y="1576" width="24" height="16"/>
  <text x="262" y="1584" class="sub" text-anchor="start">Backend (Django)</text>

  <rect class="node-ai" x="410" y="1576" width="24" height="16"/>
  <text x="442" y="1584" class="sub" text-anchor="start">AI / LLM agent</text>

  <rect class="node-db" x="560" y="1576" width="24" height="16"/>
  <text x="592" y="1584" class="sub" text-anchor="start">Database / Storage</text>

  <rect class="node-admin" x="760" y="1576" width="24" height="16"/>
  <text x="792" y="1584" class="sub" text-anchor="start">Admin</text>

  <rect class="node-ext" x="870" y="1576" width="24" height="16"/>
  <text x="902" y="1584" class="sub" text-anchor="start">External / Observability</text>

  <line x1="1090" y1="1584" x2="1140" y2="1584" class="edge" marker-end="url(#arr)"/>
  <text x="1148" y="1584" class="sub" text-anchor="start">Synchronous call</text>

  <line x1="1310" y1="1584" x2="1360" y2="1584" class="edge-dim" marker-end="url(#arrDim)"/>
  <text x="1368" y="1584" class="sub" text-anchor="start">Async · trace · RLS</text>

</svg>

