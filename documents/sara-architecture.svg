  <text x="650" y="682" class="label-sm">Canonical 4-Step Pipeline</text>
  <text x="650" y="700" class="sub">DESCRIBE - REASONING - DDx - CONCLUSION</text>

  <rect class="node-ai" x="485" y="718" width="330" height="44"/>
