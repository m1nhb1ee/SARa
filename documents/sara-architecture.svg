  <rect class="node-ai" x="1285" y="804" width="330" height="54"/>
  <text x="1450" y="824" class="label-sm">HuggingFace Gradio</text>
  <text x="1450" y="844" class="sub">ttnguyen6716/MedGemma-1.5-4B</text>

  <rect class="node-ext" x="1285" y="896" width="330" height="54"/>
