      .node-ext { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 1.4; rx: 6; }
      .label { fill: #0f172a; font-weight: 600; font-size: 13px; }
      .label-sm { fill: #0f172a; font-weight: 600; font-size: 12px; }
      .sub { fill: #64748b; font-size: 11px; }
      .edge { stroke: #1e293b; stroke-width: 1.5; fill: none; }
      .edge-dim { stroke: #94a3b8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; }
      .edge-label { fill: #334155; font-size: 11px; }
