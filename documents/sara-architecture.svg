  <text x="1050" y="826" class="sub">OpenAI GPT-4o - SSE streaming</text>

  <rect class="node-be" x="885" y="874" width="330" height="54"/>
  <text x="1050" y="894" class="label-sm">Step State + Final Grade</text>
  <text x="1050" y="914" class="sub">swap_step_states - swap_step_scores</text>

