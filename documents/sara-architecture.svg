      .group-title { fill: #0f172a; font-weight: 700; font-size: 13px; }
      .node-fe { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; rx: 6; }
      .node-be { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; rx: 6; }
      .node-ai { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; rx: 6; }
      .node-db { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.4; rx: 6; }
