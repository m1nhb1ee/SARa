    <text x="400" y="36" class="label-sm" font-weight="600">PostgreSQL with RLS</text>

    <text x="150" y="76" class="sub" font-weight="600">Users + Cases</text>
    <text x="150" y="94" class="sub">users - cases - case_images</text>
    <text x="150" y="110" class="sub">answer_keys - step_rubrics</text>
    <text x="150" y="126" class="sub">disease_profiles</text>

    <text x="400" y="76" class="sub" font-weight="600">Practice + Upload</text>
    <text x="400" y="94" class="sub">sessions - step_attempts</text>
    <text x="400" y="110" class="sub">pipeline_replays</text>
    <text x="400" y="126" class="sub">upload_sessions - upload_messages</text>

    <text x="650" y="76" class="sub" font-weight="600">Modes + Analytics</text>
    <text x="650" y="94" class="sub">swap_sessions - swap_messages</text>
    <text x="650" y="110" class="sub">swap_step_states - swap_step_scores</text>
    <text x="650" y="126" class="sub">exam_sessions - exam_step_attempts</text>
    <text x="650" y="142" class="sub">user_skill_profiles - recommendations</text>

    <text x="400" y="190" class="sub" font-style="italic">All request-scoped queries use the incoming JWT where RLS requires auth.uid().</text>
  </g>

