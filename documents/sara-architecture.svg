  <path d="M 250 814 L 250 826" class="edge" marker-end="url(#arr)"/>
  <path d="M 250 868 L 250 880" class="edge" marker-end="url(#arr)"/>

  <!-- Learning/session orchestration -->
  <rect class="subgroup" x="465" y="560" width="370" height="455"/>
  <text x="485" y="583" class="group-title" text-anchor="start">Practice + Exam Orchestration</text>

  <rect class="node-be" x="485" y="610" width="330" height="44"/>
  <text x="650" y="628" class="label-sm">SessionViewSet</text>
  <text x="650" y="646" class="sub">sessions - step_attempts - answer_key</text>

