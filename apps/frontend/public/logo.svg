<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="SARa logo">
  <title>SARa — Smart AI Radiology</title>
  <!--
    Hand-drawn line-art brain inside a radiology reticle.
    Ink (#2A241A) lines + gold (#B89042) scan-frame, matching the
    vintage medical-journal design tokens. Vector, ~2KB.
  -->
  <defs>
    <!-- Pencil/sketch jitter — matches the SketchBorder hand-drawn feel -->
    <filter id="sketch" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch)">

    <!-- Radiology reticle / scan frame -->
    <g stroke="#B89042" stroke-width="1.6">
      <circle cx="50" cy="50" r="42" opacity="0.9"/>
      <circle cx="50" cy="50" r="46" opacity="0.35" stroke-dasharray="1.5 4"/>
      <path d="M50 4 v7" opacity="0.85"/>
      <path d="M50 89 v7" opacity="0.85"/>
      <path d="M4 50 h7" opacity="0.85"/>
      <path d="M89 50 h7" opacity="0.85"/>
    </g>

    <!-- Brain (top-down, symmetric) -->
    <g stroke="#2A241A">
      <path d="M50 18
               C64 18 77 27 77 44
               C77 57 72 66 64 73
               C59 78 55 81 50 83
               C45 81 41 78 36 73
               C28 66 23 57 23 44
               C23 27 36 18 50 18 Z"
            stroke-width="2.3"/>
      <!-- faint second pass for sketch double-stroke -->
      <path d="M50 17
               C65 17 78 27 78 44
               C78 57 72 67 64 74
               C59 79 55 82 50 84
               C45 82 41 79 36 74
               C28 67 22 57 22 44
               C22 27 35 17 50 17 Z"
            stroke-width="0.8" opacity="0.3"/>
      <path d="M50 20
               C46 28 54 33 50 41
               C46 49 54 56 50 63
               C47 70 52 76 50 81"
            stroke-width="1.5" opacity="0.85"/>
      <g stroke-width="1.5" opacity="0.8">
        <path d="M57 29 C66 31 68 38 61 42"/>
        <path d="M61 46 C70 48 70 56 61 58"/>
        <path d="M59 62 C66 64 65 70 58 71"/>
      </g>
      <g stroke-width="1.5" opacity="0.8">
        <path d="M43 29 C34 31 32 38 39 42"/>
        <path d="M39 46 C30 48 30 56 39 58"/>
        <path d="M41 62 C34 64 35 70 42 71"/>
      </g>
    </g>
  </g>
</svg>
